<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PM MVP</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: #f4f7fb;
        color: #032147;
      }
      .card {
        background: white;
        padding: 2rem 3rem;
        border-radius: 1rem;
        box-shadow: 0 10px 30px rgba(3, 33, 71, 0.12);
        text-align: center;
      }
      button {
        margin-top: 1rem;
        background: #209dd7;
        color: white;
        border: none;
        border-radius: 0.75rem;
        padding: 0.75rem 1.25rem;
        cursor: pointer;
        font-weight: 600;
      }
      #result {
        margin-top: 1rem;
        font-weight: 600;
        color: #753991;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hello World</h1>
      <p>PM MVP backend is running.</p>
      <button id="helloButton" type="button">Call API</button>
      <div id="result" aria-live="polite"></div>
    </div>

    <script>
      document.getElementById('helloButton').addEventListener('click', async () => {
        const result = document.getElementById('result');
        const response = await fetch('/api/hello');
        const data = await response.json();
        result.textContent = data.message;
      });
    </script>
  </body>
</html>
